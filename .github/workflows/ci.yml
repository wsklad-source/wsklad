name: CI

# Read-only by default. A workflow that can push, create releases or write to
# issues has no business having those permissions in a lint job, and the
# least-privilege default means a compromised action cannot escalate.
permissions:
  contents: read

on:
  push:
    branches:
      - release/0.x
      - main
      - trunk
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run. On a one-maintainer
# project with three forced pushes while fixing a lint error, that saves more CI
# minutes than it costs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-php:
    name: PHP syntax ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ⚠ 7.4 is the version the plugin header declares as `Requires PHP`. If it is not
        # in this matrix, that claim is untested and therefore untrue by omission: nobody
        # on a 7.4 host finds out until a user reports a parse error. 8.4 is the version
        # everything is developed against. 8.5 catches the next major's deprecations
        # before they become this major's bugs.
        php: ['7.4', '8.4', '8.5']
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up PHP
        # shivammathur/setup-php v2.37.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: parallel-lint
      - name: Lint
        run: vendor/bin/parallel-lint --exclude vendor --exclude node_modules .

  lint-cs:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up PHP
        # shivammathur/setup-php v2.37.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPCS (blocking)
        # `phpcs.xml.dist` holds only the sniffs whose failures reach production:
        # unprepared SQL, unescaped output, missing nonces, PHP 8 syntax on a PHP 7.4
        # site. It is currently green.
        #
        # ⚠ phpcs exits 1 on warnings as well as errors, so "0 errors" is not a green
        # job. That bit this project twice: 10 `AlternativeFunctions` warnings on the
        # translation generator left the job red with nothing in the error column.
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  i18n:
    name: Translation template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up PHP
        # shivammathur/setup-php v2.37.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          # The oldest supported version, because the generator uses nothing newer and
          # nothing older. If it ever needs a newer syntax than the plugin itself, that
          # is a bug worth catching here rather than on a 7.4 site.
          php-version: '7.4'
          coverage: none
      - name: The .pot matches the code
        # ⚠ No `composer install` in this job, deliberately. The generator has no
        # dependencies beyond PHP, and running install would only add a way for this
        # job to fail for an unrelated reason.
        #
        # The .pot ships in the release ZIP, so it is a released artefact, and this is
        # the check that keeps it equal to the code. It has already drifted twice: ten
        # msgids for screens that were deleted months ago, and two strings whose msgid
        # used a hyphen where the source used an em dash, so they never resolved and no
        # counter noticed.
        run: php tools/make-pot.php --check

  audit:
    name: Release audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up PHP
        # shivammathur/setup-php v2.37.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          # 7.4, the oldest supported version, for the same reason the i18n job uses it:
          # a gate that only runs on the newest PHP stops catching code a 7.4 site
          # cannot parse. All six are plain PHP and declare no dependencies.
          php-version: '7.4'
          coverage: none
      - name: Dangling paths, symbols, claims, copy, assets and wp.org
        # ⚠ No `composer install`, deliberately. These scripts need nothing but
        # PHP, and an install would add a way for this job to fail for a reason that
        # has nothing to do with what it checks.
        #
        # These used to live only in `%TEMP%\opencode` on one developer's machine.
        # That is not a gate: it cannot run in CI, no reviewer can reproduce it, and
        # it is gone the next time the temp directory is cleared. They are what found
        # the fatal on every request, the fictional `0.11.0`/`0.12.0` versions and the
        # changelog that named the same version twice.
        #
        # `verify-copy.php` prints "skipped" for its two parser-dependent checks,
        # because the gettext parser is an agent tool that is not in this repository.
        # Skipped is printed, not assumed, so a partial run can never be read as a
        # clean one. The ground those two lose is covered here by the i18n job.
        #
        # `assets.php` is the sixth. It answers a question the other five do not: of
        # what the ZIP carries, how much does a browser actually fetch, and does any of
        # it point at a file the ZIP does not contain. Two `sourceMappingURL` comments
        # and 45 KB of an unminified library that is never enqueued were all invisible
        # to every other check, and all three were found by looking rather than by a
        # gate, which is the reason this one exists.
        run: |
          php tools/xref.php
          php tools/dangling.php
          php tools/claims.php
          php tools/verify-copy.php
          php tools/wporg.php
          php tools/assets.php

# Removed jobs, and why
  #
  # `lint-hooks`, `test-integration`, `test-order-storage`, `test-unit` and
  # `test-compat` ran `tests/` and the old `tools/`. The `tests/` directory is not in
  # the repository any more: the plugin is the deliverable, and the dev apparatus behind
  # it is not part of it.
  #
  # What that costs, stated plainly rather than discovered later: this workflow still
  # runs no test suite. The suite that found the real defects - a salt that could not
  # be stored, a self-heal that never ran, a credential reaching the log in the clear -
  # lived in tests/Integration and is preserved in the history of the branch that
  # carried it, not here.
  #
  # What is here is worth more than the jobs it replaced, because it cannot pass by
  # accident: every file must parse on the oldest and the newest PHP the plugin claims
  # to support, the coding standard is enforced rather than advised, the translation
  # template is compared against a fresh extraction of the code, and the five release
  # audit gates run on every push. `composer.lock` is committed so that "which monolog
  # is running on the site" has an answer.
