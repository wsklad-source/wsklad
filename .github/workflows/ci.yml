name: CI

# Read-only by default. A workflow that can push, create releases or write to
# issues has no business having those permissions in a lint job, and the
# least-privilege default means a compromised action cannot escalate.
permissions:
  contents: read

on:
  push:
    branches:
      - release/0.x
      - main
      - trunk
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run. On a one-maintainer
# project with three forced pushes while fixing a lint error, that saves more CI
# minutes than it costs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-php:
    name: PHP syntax ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ⚠ 7.4 is the version the plugin header declares as `Requires PHP`. If it is not
        # in this matrix, that claim is untested and therefore untrue by omission: nobody
        # on a 7.4 host finds out until a user reports a parse error. 8.4 is the version
        # everything is developed against. 8.5 catches the next major's deprecations
        # before they become this major's bugs.
        php: ['7.4', '8.4', '8.5']
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up PHP
        # shivammathur/setup-php v2.37.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: parallel-lint
      - name: Lint
        run: vendor/bin/parallel-lint --exclude vendor --exclude node_modules .

  lint-cs:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up PHP
        # shivammathur/setup-php v2.37.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPCS (blocking)
        # `phpcs.xml.dist` holds only the sniffs whose failures reach production:
        # unprepared SQL, unescaped output, missing nonces, PHP 8 syntax on a PHP 7.4
        # site. It is currently green.
        # ⚠ `composer install` here needs a lock file that matches composer.json. It does
        # not, and a mirror that rewrites dist URLs would make it worse, so this job is
        # red until the lock is regenerated on a machine that can reach Packagist.
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  # Removed jobs, and why
  #
  # `lint-hooks`, `test-integration`, `test-order-storage`, `test-unit` and
  # `test-compat` ran `tools/` and `tests/`. Neither directory is in the
  # repository any more: the plugin is the deliverable, and the dev apparatus
  # behind it is not part of it.
  #
  # What that costs, stated plainly rather than discovered later: this workflow no
  # longer runs a single test. The suite that found the real defects - a salt that
  # could not be stored, a self-heal that never ran, a credential reaching the log
  # in the clear - lived in tests/Integration and is preserved in the history of
  # the branch that carried it, not here.
  #
  # What is still here is worth more than the jobs it replaced, because it cannot
  # pass by accident: every file must parse on the oldest and the newest PHP the
  # plugin claims to support, and the coding standard is enforced rather than
  # advised. `composer.lock` is committed so that "which monolog is running on the
  # site" has an answer.
