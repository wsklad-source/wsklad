# Dependabot configuration for the WSKLAD plugin.
#
# Five of the eight runtime dependencies are pinned to `dev-*` branches rather
# than to tags. That is the real supply-chain risk in this project, and it is not
# something Dependabot can fix: a branch constraint has no versions to compare,
# so no version update will ever be proposed for it. The value here is the
# security alerts and the dev-tool updates, which do have versions.
version: 2

updates:
    # Runtime and dev dependencies. A plugin installed from WordPress.org never
    # runs `composer update`, so an unattended security update here is how a
    # vulnerable library ever reaches a user's site.
    - package-ecosystem: composer
      directory: '/'
      schedule:
        interval: weekly
        day: monday
        time: '07:00'
        timezone: Europe/Moscow
      open-pull-requests-limit: 5
      labels:
        - dependencies
        - composer
      commit-message:
        prefix: 'deps'
      # Grouped, because five separate PRs a week is five separate reviews, and a
      # reviewer who sees them one at a time does not see the interaction between
      # them. WPCS 3.0 and PHPCompatibility 10.0 in particular have to move
      # together or the lint job breaks.
      groups:
        dev-tooling:
          patterns:
            - 'squizlabs/*'
            - 'wp-coding-standards/*'
            - 'phpcompatibility/*'
            - 'php-parallel-lint/*'
            - 'phpstan/*'
            - 'yoast/*'
        phpunit:
          patterns:
            - 'phpunit/*'
            - 'php-stubs/*'

    # The actions in .github/workflows/ci.yml and the two deploy workflows.
    #
    # The workflows pin every action to a full commit SHA, so Dependabot will
    # open a PR that updates the SHA *and* the tag comment above it. That comment
    # is the only record of which release the SHA belongs to, so it has to move
    # with the SHA or the pinning becomes unauditable.
    - package-ecosystem: github-actions
      directory: '/'
      schedule:
        interval: weekly
        day: monday
        time: '07:00'
        timezone: Europe/Moscow
      open-pull-requests-limit: 5
      labels:
        - dependencies
        - ci
      commit-message:
        prefix: 'ci'
